name: NVDS4 Nightly Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nvds4-nightly
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.0
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qttools

      - name: Cache CMake build
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          append-timestamp: false
          key: windows-nvds4
          max-size: 5G

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=ON \
            -DENABLE_QT_LAUNCHER=ON

      - name: Build
        shell: bash
        run: cmake --build build --config $BUILD_TYPE --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/nvds4.exe dist/nvds4.exe
          Copy-Item build/nvds4-launcher.exe dist/nvds4-launcher.exe
          windeployqt --release --no-translations --dir dist dist/nvds4-launcher.exe
          Compress-Archive -Path dist/* -DestinationPath NVDS4-windows-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: NVDS4-windows-x64
          path: NVDS4-windows-x64.zip

  macos:
    name: macOS arm64 DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake meson pkg-config llvm spirv-tools spirv-llvm-translator ninja python
          PYTHON3="$(brew --prefix python)/bin/python3"
          "$PYTHON3" -m pip install --break-system-packages mako packaging pyyaml
          echo "$(brew --prefix python)/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$PYTHON3" >> "$GITHUB_ENV"
          SITE_PACKAGES="$("$PYTHON3" -c 'import site; print(site.getsitepackages()[0])')"
          echo "PYTHONPATH=$SITE_PACKAGES" >> "$GITHUB_ENV"

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.0
          host: mac
          target: desktop
          arch: clang_64
          archives: qtbase qttools

      - name: Cache CMake build
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          append-timestamp: false
          create-symlink: true
          key: macos-nvds4
          max-size: 5G
          variant: sccache

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=ON \
            -DENABLE_QT_LAUNCHER=ON

      - name: Build
        run: cmake --build build --config $BUILD_TYPE --parallel $(sysctl -n hw.ncpu)

      - name: Package .app and DMG
        run: |
          set -euo pipefail
          APP="dist/NVDS4.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp build/nvds4-launcher "$APP/Contents/MacOS/nvds4-launcher"
          cp build/nvds4 "$APP/Contents/MacOS/nvds4"
          chmod +x "$APP/Contents/MacOS/nvds4-launcher" "$APP/Contents/MacOS/nvds4"

          python3 - <<'PY'
          from pathlib import Path

          template = Path("src/dist/NVDS4LauncherInfo.plist.in").read_text()
          replacements = {
              "__APP_VERSION__": "0.18.1 Nightly",
              "__APP_VERSION_NUM__": "0.18.1",
              "__MACOS_DEPLOYMENT_TARGET__": "26.0",
          }
          for key, value in replacements.items():
              template = template.replace(key, value)

          Path("dist/NVDS4.app/Contents/Info.plist").write_text(template)
          PY

          cp build/libvulkan.dylib "$APP/Contents/MacOS/" || true
          cp build/libvulkan_kosmickrisp.dylib "$APP/Contents/MacOS/" || true
          cp build/kosmickrisp_mesa_icd.json "$APP/Contents/Resources/" || true

          macdeployqt "$APP"

          # hdiutil needs free space for its temporary compressed image.
          rm -rf build
          df -h .

          codesign --force --deep --sign - "$APP"
          hdiutil create -volname "NVDS4" -srcfolder "$APP" -ov -format UDZO "NVDS4-macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: NVDS4-macos-arm64
          path: NVDS4-macos-arm64.dmg

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Add LLVM repository
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y             libx11-dev libxext-dev libwayland-dev libdecor-0-dev libxkbcommon-dev             libglfw3-dev libgles2-mesa-dev libfuse2 clang-19 mold build-essential             libasound2-dev libpulse-dev libopenal-dev libudev-dev libxcursor-dev             libxi-dev libxss-dev libxtst-dev

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.0
          arch: linux_gcc_64
          setup-python: false
          cache: true

      - name: Cache CMake build
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          append-timestamp: false
          key: linux-nvds4
          max-size: 5G

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold" \
            -DENABLE_TESTS=OFF \
            -DENABLE_UPDATER=ON \
            -DENABLE_QT_LAUNCHER=ON

      - name: Build
        run: cmake --build build --config $BUILD_TYPE --parallel $(nproc)

      - name: Package
        run: |
          mkdir -p dist
          cp build/nvds4 dist/nvds4
          cp build/nvds4-launcher dist/nvds4-launcher
          tar -czf NVDS4-linux-x64.tar.gz -C dist nvds4 nvds4-launcher

      - uses: actions/upload-artifact@v7
        with:
          name: NVDS4-linux-x64
          path: NVDS4-linux-x64.tar.gz

  release:
    name: Publish NVDS4 Nightly
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish moving nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            artifacts/NVDS4-windows-x64/NVDS4-windows-x64.zip \
            artifacts/NVDS4-macos-arm64/NVDS4-macos-arm64.dmg \
            artifacts/NVDS4-linux-x64/NVDS4-linux-x64.tar.gz \
            --target "${GITHUB_SHA}" \
            --title "NVDS4 Nightly $DATE" \
            --notes "Automated NVDS4 build from commit ${GITHUB_SHA} (${SHORT_SHA})." \
            --latest
